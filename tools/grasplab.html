<!doctype html><meta charset="utf-8"><title>grip lab</title>
<style>html,body{margin:0;background:#20242a}canvas{display:block}</style>
<script type="importmap">IMPORTMAP</script>
<script type="module">
// The real body's right hand on the real shapes it will hold: each grip photographed close from three sides, and

import * as THREE from 'three';

const q = new URLSearchParams(location.search), ONLY = q.get('only'); globalThis.__noThumb = !!q.get('nothumb');
const g = await new GLTFLoader().loadAsync('../assets/adventurer.glb'); const by = {}; g.scene.traverse(o => { if (o.name) by[o.name] = by[o.name] || o; });
g.scene.traverse(o => { if (o.isBone) o.userData.q0 = o.quaternion.clone(); });

const NX = 3, TW = +(q.get('tile') || 300), TH = TW;
if (q.get('rest')) {      // the hand as modelled, with the palm's measured normal drawn out of it (green) and the thumb side (red)
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(900, 300); document.body.append(renderer.domElement); renderer.setScissorTest(true);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8a97a3); scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 2)); scene.add(g.scene); g.scene.updateMatrixWorld(true);
  const w = by.hand_r.getWorldPosition(new THREE.Vector3()), Q = by.hand_r.getWorldQuaternion(new THREE.Quaternion());
  scene.add(new THREE.ArrowHelper(H.local.N.clone().applyQuaternion(Q), w, 0.12, 0x00ff00)); scene.add(new THREE.ArrowHelper(H.local.A.clone().applyQuaternion(Q), w, 0.08, 0xff0000));
  const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 10); [[0.4, 0, 0], [-0.4, 0, 0], [0, 0, 0.4]].forEach((o, i) => { renderer.setViewport(i * 300, 0, 300, 300); renderer.setScissor(i * 300, 0, 300, 300); cam.position.copy(w).add(new THREE.Vector3(...o)); cam.lookAt(w); renderer.render(scene, cam); });
  window.LAB = { done: true, report: [{ N: H.local.N.clone().applyQuaternion(Q).toArray().map(x => +x.toFixed(2)), w: w.toArray().map(x => +x.toFixed(2)) }] };
  throw 'rest';
}
// the grips: x is the climber's right, the wall's face is z = 0 (out toward the climber is +z), its lip at y = 2.05
const Y0 = 2.05, rows = [
  { name: 'lip 5 cm', g: { kind: 'ledge', d: 0.05, th: 0.06 } },
  { name: 'sill 11 cm', g: { kind: 'ledge', d: 0.11, th: 0.06 } },
  { name: 'band 10x24', g: { kind: 'ledge', d: 0.10, th: 0.24 } },
  { name: 'roof edge', g: { kind: 'top' } },
  { name: 'corner', g: { kind: 'corner' } },
  { name: 'pipe', g: { kind: 'pipe', r: 0.048, C: [0, 0], standoff: 0.09 } },
].filter(r => !ONLY || r.name.startsWith(ONLY));
const NY = rows.length;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(NX * TW, NY * TH); document.body.append(renderer.domElement); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.autoClear = false; renderer.setScissorTest(true);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8a97a3); scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 1.5)); const sun = new THREE.DirectionalLight(0xffffff, 2.4); sun.position.set(2, 5, 4); scene.add(sun);
scene.add(g.scene);
const stone = new THREE.MeshStandardMaterial({ color: 0xb9b4a8, roughness: 0.9 }), metal = new THREE.MeshStandardMaterial({ color: 0x8d9193, roughness: 0.5, metalness: 0.5 });
const cam = new THREE.PerspectiveCamera(30, TW / TH, 0.01, 50), report = [];
const handVerts = (() => { const sk = body.skeleton, ids = new Set([by.hand_r, ...['index', 'middle', 'ring', 'pinky', 'thumb'].flatMap(f => fing(f, 'r'))].map(b => sk.bones.indexOf(b))), out = [], sw = body.geometry.attributes.skinWeight, si = body.geometry.attributes.skinIndex;
  for (let i = 0; i < sw.count; i++) { let w = 0; for (let k = 0; k < 4; k++) if (ids.has(si.getComponent(i, k))) w += sw.getComponent(i, k); if (w > 0.5) out.push(i); } return out; })();
const thick = () => { const out = {}; for (const [nm, nx] of [['thumb_01_r', 'thumb_02_r'], ['thumb_02_r', 'thumb_03_r'], ['index_01_r', 'index_02_r']]) { const bi = body.skeleton.bones.indexOf(by[nm]), A = by[nm].getWorldPosition(new THREE.Vector3()), B = by[nx].getWorldPosition(new THREE.Vector3()), ax = B.clone().sub(A), L = ax.length(); ax.normalize(); let sum = 0, n = 0, mx = 0; const sw = body.geometry.attributes.skinWeight, si = body.geometry.attributes.skinIndex, v = new THREE.Vector3();
  for (const i of handVerts) { let ok = false; for (let k = 0; k < 4; k++) if (si.getComponent(i, k) === bi && sw.getComponent(i, k) > 0.6) ok = true; if (!ok) continue; body.getVertexPosition(i, v); v.applyMatrix4(body.matrixWorld); const r = v.sub(A), t = r.dot(ax); if (t < 0 || t > L) continue; const d = r.addScaledVector(ax, -t).length(); sum += d; n++; mx = Math.max(mx, d); } out[nm] = [+(sum / Math.max(1, n) * 1000).toFixed(1), +(mx * 1000).toFixed(1), n]; } return out; };
for (const b of Object.values(by)) if (b.isBone && b.userData.q0) b.quaternion.copy(b.userData.q0); g.scene.updateMatrixWorld(true); const thickRest = thick();
for (let row = 0; row < NY; row++) {
  const R = rows[row], G = R.g, set = new THREE.Group(); scene.add(set);
  // the solid, built from the same numbers the hand is planned against
  if (G.kind === 'ledge') { const w = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 0.4), stone); w.position.set(0, Y0, -G.d - 0.2); set.add(w); const l = new THREE.Mesh(new THREE.BoxGeometry(3, G.th, G.d), stone); l.position.set(0, Y0 - G.th / 2, -G.d / 2); set.add(l);
    Object.assign(G, { E: [0, Y0, 0], O: [0, 0, 1], Y: [0, 1, 0] }); }
  if (G.kind === 'top') { const w = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.6), stone); w.position.set(0, Y0 - 1.5, -0.3); set.add(w); Object.assign(G, { E: [0, Y0, 0], O: [0, 0, 1], Y: [0, 1, 0] }); }
  if (G.kind === 'corner') { const w = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 2), stone); w.position.set(0.3 - 1, Y0, -1); set.add(w); Object.assign(G, { E: [0.3, Y0, 0], O: [0, 0, 1], Y: [1, 0, 0] }); }
  if (G.kind === 'pipe') { const w = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 0.4), stone); w.position.set(0, Y0, -0.09 - 0.2); set.add(w); const p = new THREE.Mesh(new THREE.CylinderGeometry(G.r, G.r, 4, 24), metal); p.position.set(0.25, Y0, 0); set.add(p);
    Object.assign(G, { E: [0.25, Y0, 0], O: [0, 0, 1], Y: [1, 0, 0] }); }
  // the body: facing the wall (-z), standing back from it; the right arm reaches the wrist's spot, the hand takes hold
  g.scene.rotation.set(0, Math.PI, 0); g.scene.position.set(0.1, Y0 - 2.05 + (G.kind === 'corner' ? 0 : 0), 0.32); g.scene.updateMatrixWorld(true);
  for (const b of Object.values(by)) if (b.isBone && b.userData.q0) { b.quaternion.copy(b.userData.q0); }
  g.scene.updateMatrixWorld(true);
  let wr = new THREE.Vector3(...wristFor(G, H)), sh = by.upperarm_r.getWorldPosition(new THREE.Vector3());
  { // the shoulder a hanging climber's distance out from the face, the elbow a little bent
    const Ov = new THREE.Vector3(...G.O), Yv = new THREE.Vector3(...G.Y), up = Yv.y > 0.5 ? 1 : 0, want = new THREE.Vector3(...G.E).addScaledVector(Ov, 0.3);
    want.y = wr.y - Math.sqrt(Math.max(0, 0.47 ** 2 - want.clone().sub(wr).setY(0).lengthSq())); if (!up) want.addScaledVector(Yv, -0.15);
    g.scene.position.add(want.sub(sh)); g.scene.updateMatrixWorld(true); sh = by.upperarm_r.getWorldPosition(new THREE.Vector3()); }
  const miss = solveLimb(by.upperarm_r, by.lowerarm_r, by.hand_r, wr, sh.clone().add(new THREE.Vector3(-0.4, -0.5, 0.3)));
  gripHand(H, G, 1); g.scene.updateMatrixWorld(true);
  // measure the skin: depth into the solid (by its 2D field, in the grip's frame), and how much is in touch
  const sd = solidOf(G), F = frameOf(G), v = new THREE.Vector3(); let pen = 0, touch = 0, worst = null, wi = -1; const byBone = {};
  const sw = body.geometry.attributes.skinWeight, si = body.geometry.attributes.skinIndex, bn = i => { let b = -1, w = 0; for (let k = 0; k < 4; k++) if (sw.getComponent(i, k) > w) { w = sw.getComponent(i, k); b = si.getComponent(i, k); } return body.skeleton.bones[b].name; };
  for (const i of handVerts) { body.getVertexPosition(i, v); v.applyMatrix4(body.matrixWorld); const r = v.clone().sub(F.E), d = sd(r.dot(F.O), r.dot(F.Ys)); if (-d > pen) { pen = -d; worst = v.clone(); wi = i; } if (d < 0.003) touch++; if (d < -0.002) { const n = bn(i); byBone[n] = (byBone[n] || 0) + 1; } }
  const wr2 = worst ? worst.clone().sub(F.E) : null, wloc = worst ? (() => { const hw = by.hand_r.getWorldPosition(new THREE.Vector3()), hq = by.hand_r.getWorldQuaternion(new THREE.Quaternion()).invert(), l = worst.clone().sub(hw).applyQuaternion(hq); return [l.dot(H.local.F), l.dot(H.local.N), l.dot(H.local.A)].map(x => +x.toFixed(3)); })() : null;
  const rep = gripReport(G, H);
  const gaps = {}; for (const fn of ['index', 'middle', 'ring', 'pinky', 'thumb']) { const bi = body.skeleton.bones.indexOf(by[fn + '_03_r']); let mg = Infinity; for (const i of handVerts) { let ok = false; for (let k = 0; k < 4; k++) if (si.getComponent(i, k) === bi && sw.getComponent(i, k) > 0.5) ok = true; if (!ok) continue; body.getVertexPosition(i, v); v.applyMatrix4(body.matrixWorld); const r = v.clone().sub(F.E); mg = Math.min(mg, sd(r.dot(F.O), r.dot(F.Ys))); } gaps[fn] = +(mg * 1000).toFixed(1); }
  const elb = (() => { const a = by.upperarm_r.getWorldPosition(new THREE.Vector3()), b = by.lowerarm_r.getWorldPosition(new THREE.Vector3()), c = by.hand_r.getWorldPosition(new THREE.Vector3()); return +(180 - a.sub(b).angleTo(c.sub(b)) * 180 / Math.PI).toFixed(0); })();
  const thDeg = H.thumb.bones.map((b, i) => +(b.quaternion.angleTo(H.thumb.q0[i]) * 57.3).toFixed(0));
  const thumbOYT = [...H.thumb.bones.map(b => b.getWorldPosition(new THREE.Vector3())), by.middle_01_r.getWorldPosition(new THREE.Vector3()), by.hand_r.getWorldPosition(new THREE.Vector3())].map(p => { const r = p.sub(F.E); return [r.dot(F.O), r.dot(F.Ys), r.dot(new THREE.Vector3().crossVectors(F.O, F.Y))].map(x => +(x * 100).toFixed(1)); });
  report.push({ name: R.name, thickRest, thick: thick(), thumbOYT, thumbDbg: H.thumbDbg, thDeg, twDeg: +((H.lastTw || 0) * 180 / Math.PI).toFixed(0), elbowFlexDeg: elb, tipGapMM: gaps, armMiss: +miss.toFixed(3), penMM: +(pen * 1000).toFixed(1), touch, worstBone: wi >= 0 ? bn(wi) : null, worstOY: wr2 ? [wr2.dot(F.O), wr2.dot(F.Ys)].map(x => +x.toFixed(3)) : null, worstFNA: wloc, inside: byBone, W: rep.W, plan0: rep.middle, rp: +H.rp.toFixed(4), rf: +H.rf.toFixed(4) });
  if (worst) { const m = new THREE.Mesh(new THREE.SphereGeometry(0.003), new THREE.MeshBasicMaterial({ color: 0xff00ff, depthTest: false })); m.position.copy(worst); m.renderOrder = 9; set.add(m); }
  const c = new THREE.Vector3(...G.E).addScaledVector(new THREE.Vector3(...G.O), 0.02);
  const views = [[0.0, 0.12, 0.42], [0.42, 0.06, 0.08], [0.25, 0.32, 0.25]];
  for (let i = 0; i < NX; i++) {
    const yy = (NY - 1 - row) * TH; renderer.setViewport(i * TW, yy, TW, TH); renderer.setScissor(i * TW, yy, TW, TH); renderer.clear();
    const [vx, vy, vz] = views[i]; cam.position.set(c.x + vx, c.y + vy, c.z + vz); cam.lookAt(c.x, c.y - 0.02, c.z); renderer.render(scene, cam);
  }
  scene.remove(set);
}
for (const b of Object.values(by)) void b;
window.LAB = { done: true, report };
</script>
